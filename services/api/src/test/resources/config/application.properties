# Test-only overrides, loaded on top of src/main/resources/application.properties
# (Spring Boot reads classpath:/config/application.properties after classpath:/application.properties).

# Tests have no signing-key secret: sign with a key generated at start-up.
# The fail-fast tests set this back to false.
washbase.auth.allow-generated-signing-key=true

# The web app's client is registered in every test context, so the sign-in flow can be driven end to end
# (com.washbase.api.auth.SignInFlow). A test-only value, like LOCAL_WEB_CLIENT_SECRET in scripts/local-env.mjs.
washbase.auth.web-client.secret=test-web-client-secret
washbase.auth.web-client.redirect-uri=http://localhost:3000/auth/callback
