spring.application.name=api

# Local dev DB from the root docker-compose.yml (host port 5433). Override via env in other environments.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/washbase}
spring.datasource.username=${DATABASE_USERNAME:washbase}
spring.datasource.password=${DATABASE_PASSWORD:washbase}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Security (ADR-001). /v3/api-docs + Swagger UI stay public unless WASHBASE_PUBLIC_API_DOCS=false (production only).
washbase.security.public-api-docs=${WASHBASE_PUBLIC_API_DOCS:true}
# Issuer URL of the embedded authorization server (iss claim, OIDC discovery) and the access-token audience.
washbase.auth.issuer=${WASHBASE_AUTH_ISSUER:http://localhost:8080}
washbase.auth.audience=washbase-api
# RS256 signing key, PKCS#8 PEM: a deployment secret. Without it the API refuses to start, unless a throwaway key
# generated at start-up is allowed (local runs, tests and CI only: scripts/api.mjs and profile "local" allow it).
washbase.auth.signing-key=${WASHBASE_AUTH_SIGNING_KEY:}
washbase.auth.allow-generated-signing-key=${WASHBASE_AUTH_ALLOW_GENERATED_SIGNING_KEY:false}
# The web app's OAuth client (confidential, Authorization Code + PKCE). Not registered while the secret is unset.
washbase.auth.web-client.client-id=washbase-web
washbase.auth.web-client.secret=${WASHBASE_WEB_CLIENT_SECRET:}
washbase.auth.web-client.redirect-uri=${WASHBASE_WEB_REDIRECT_URI:http://localhost:3000/auth/callback}
# How long a sign-in lasts without use (ISO-8601). Refresh tokens are rotated on every use, each with this lifetime.
washbase.auth.refresh-token-ttl=${WASHBASE_AUTH_REFRESH_TOKEN_TTL:P30D}
# Sign-in pause (CAR-19): this many failed sign-ins for one email or mobile number within the window pause sign-in
# for that identifier for the pause (ISO-8601 durations). The pause is also the "Try again in N minutes." text.
washbase.auth.sign-in-limit.max-failures=${WASHBASE_AUTH_SIGN_IN_LIMIT_MAX_FAILURES:5}
washbase.auth.sign-in-limit.window=${WASHBASE_AUTH_SIGN_IN_LIMIT_WINDOW:PT15M}
washbase.auth.sign-in-limit.pause=${WASHBASE_AUTH_SIGN_IN_LIMIT_PAUSE:PT15M}

# Admin bootstrap (ADR-001): deployment secrets, never in the repo. Used only when no active Admin exists.
washbase.admin.email=${WASHBASE_ADMIN_EMAIL:}
washbase.admin.mobile=${WASHBASE_ADMIN_MOBILE:}
washbase.admin.initial-password=${WASHBASE_ADMIN_INITIAL_PASSWORD:}
