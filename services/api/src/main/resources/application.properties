spring.application.name=api

# Local dev DB from the root docker-compose.yml (host port 5433). Override via env in other environments.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/washbase}
spring.datasource.username=${DATABASE_USERNAME:washbase}
spring.datasource.password=${DATABASE_PASSWORD:washbase}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Security (ADR-001). /v3/api-docs + Swagger UI stay public unless WASHBASE_PUBLIC_API_DOCS=false (production only).
washbase.security.public-api-docs=${WASHBASE_PUBLIC_API_DOCS:true}
# Issuer URL of the embedded authorization server (iss claim, OIDC discovery) and the access-token audience.
washbase.auth.issuer=${WASHBASE_AUTH_ISSUER:http://localhost:8080}
washbase.auth.audience=washbase-api

# Admin bootstrap (ADR-001): deployment secrets, never in the repo. Used only when no active Admin exists.
washbase.admin.email=${WASHBASE_ADMIN_EMAIL:}
washbase.admin.mobile=${WASHBASE_ADMIN_MOBILE:}
washbase.admin.initial-password=${WASHBASE_ADMIN_INITIAL_PASSWORD:}
