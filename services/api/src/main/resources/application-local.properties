# Profile "local": only for manual testing on a developer machine (`pnpm dev:all` activates it).

# Switching between branches/PRs leaves migrations in the local database that the current code
# doesn't have. Don't fail on those; if a migration *changed*, run `pnpm db:reset`.
spring.flyway.ignore-migration-patterns=*:missing

# No signing key on a developer machine: sign with a key generated at start-up (a restart signs everyone out).
washbase.auth.allow-generated-signing-key=true
