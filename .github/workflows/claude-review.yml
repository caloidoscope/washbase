name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't get repo secrets, so the review can't authenticate there.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the reviewer can diff the PR against its base.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR as the Senior Dev would: follow CLAUDE.md and use the checklist in
            ".claude/agents/senior-dev.md" (Mode 2: Review) — correctness, contract-first
            (API changes come with a regenerated packages/api-client), patterns, tests, security.
            If the PR links a Linear issue, check the change against its acceptance criteria as
            described in the PR body. Skip style nits that lint already covers.
            Leave inline comments for specific issues and one short summary comment ending in
            APPROVED or CHANGES REQUESTED.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
