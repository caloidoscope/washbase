name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # A second, independent review only where mistakes are costly: authentication, security
    # configuration, database migrations and design decisions. Every other PR gets senior-dev's
    # review only (see CLAUDE.md → Workflow), which keeps token usage down.
    paths:
      - services/api/src/main/java/com/washbase/api/auth/**
      - services/api/src/main/java/com/washbase/api/config/**
      - services/api/src/main/resources/db/migration/**
      - apps/web/src/lib/auth/**
      - apps/web/src/app/auth/**
      - apps/web/src/proxy.ts
      - apps/mobile/src/lib/auth/**
      - docs/architecture/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't get repo secrets, so the review can't authenticate there.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the reviewer can diff the PR against its base.
          fetch-depth: 0
      # The repo's .mcp.json is for local development (Postgres, GitHub and Linear MCP servers with
      # local URLs and secrets). In CI those servers can't start, and the reviewer then fails to post.
      - name: Drop local MCP config
        run: rm -f .mcp.json
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR as the Senior Dev would: follow CLAUDE.md and use the checklist in
            ".claude/agents/senior-dev.md" (Mode 2: Review) — correctness, contract-first
            (API changes come with a regenerated packages/api-client), patterns, tests, security.
            If the PR links a Linear issue, check the change against its acceptance criteria as
            described in the PR body. Skip style nits that lint already covers.
            Leave inline comments for specific issues and one short summary comment ending in
            APPROVED or CHANGES REQUESTED. Always post the summary with `gh pr comment`, even if
            other tools are unavailable; a verdict that only appears in the job log is lost.
          # Show the reviewer's full output in the job log, so denied tools and errors are visible.
          show_full_output: true
          # Read-only access to the checkout (files, diffs, history) plus the PR comment tools.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
