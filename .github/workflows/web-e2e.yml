name: Web & JS CI

on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - services/api/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-e2e.yml
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - services/api/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-e2e.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint & typecheck (web, mobile, api-client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  e2e:
    name: Playwright E2E (web + API)
    runs-on: ubuntu-latest
    # Playwright starts the API itself (scripts/api.mjs serve) against this database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: washbase
          POSTGRES_USER: washbase
          POSTGRES_PASSWORD: washbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U washbase -d washbase"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/washbase
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
